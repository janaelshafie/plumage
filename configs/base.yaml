# Shared defaults. Task configs inherit with `base: base.yaml` and override what they need.

seed: 42
device: null            # null = auto (cuda > mps > cpu)

data:
  train_dataset: Multimodal-Fatima/CUB_train
  test_dataset: Multimodal-Fatima/CUB_test
  cache_dir: data/hf_cache   # HF download cache (gitignored)
  num_classes: 200
  val_fraction: 0.1          # held out per class from the train split
  split_seed: 42             # fixed: changing it invalidates val_indices.json
  val_indices_path: configs/splits/val_indices.json
  image_size: 224
  batch_size: 32
  num_workers: 2
  # Normalization. ImageNet stats are the placeholder; Habiba adds the CUB train stats in Step 2.
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]

tracking:
  backend: mlflow            # mlflow | wandb | none
  experiment: plumage-milestone1
  # Leave null to use MLFLOW_TRACKING_URI from the environment (the shared DagsHub server),
  # falling back to a local ./mlruns folder.
  tracking_uri: null
  wandb_entity: null         # only used when backend: wandb

output_dir: outputs
